<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Look up a college by name using College Scorecard data." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>Find by Name</title>
  </head>
  <body>
    <main>
      <page-header heading="Find it by name." accent="name" current="name"></page-header>
      <section class="search-card" aria-labelledby="search-title">
        <div class="section-heading">
          <div>
            <h2 id="search-title">School name</h2>
          </div>
          <span class="quiet">Matches anywhere in the U.S.</span>
        </div>
        <college-name-form></college-name-form>
        <p class="hint">Enter all or part of a school's name — partial matches are included.</p>
      </section>

      <college-results></college-results>
    </main>
    <footer>
      <span>Data from the U.S. Department of Education College Scorecard</span
      ><a href="https://collegescorecard.ed.gov/data/" target="_blank" rel="noreferrer">API documentation ↗</a>
    </footer>
    <script type="module" src="/src/name-search.js"></script>
  </body>
</html>
