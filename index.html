<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Find colleges using College Scorecard data." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>Colleges Find</title>
  </head>
  <body>
    <main>
      <page-header heading="Find the colleges." accent="colleges" current="location"></page-header>
      <section class="search-card" aria-labelledby="search-title">
        <div class="section-heading">
          <div>
            <h2 id="search-title">Search parameters</h2>
          </div>
        </div>
        <college-search-form></college-search-form>
      </section>

      <college-results></college-results>
    </main>
    <footer>
      <span>Data from the U.S. Department of Education College Scorecard</span
      ><a href="https://collegescorecard.ed.gov/data/" target="_blank" rel="noreferrer">API documentation ↗</a>
    </footer>
    <section class="palette" aria-label="Theme palette">
      <div class="palette-group">
        <ul class="swatches">
          <li style="background: var(--color-text)"></li>
          <li style="background: var(--color-text-faint)"></li>
          <li style="background: var(--color-border)"></li>
          <li style="background: var(--color-surface-alt)"></li>
          <li style="background: var(--color-bg)"></li>
        </ul>
        <ul class="swatches">
          <li style="background: var(--color-ink)"></li>
          <li style="background: var(--color-ink-soft)"></li>
          <li style="background: var(--color-green)"></li>
          <li style="background: var(--color-on-dark)"></li>
        </ul>
        <ul class="swatches">
          <li style="background: var(--color-instate-accent)"></li>
          <li style="background: var(--color-instate-border)"></li>
          <li style="background: var(--color-instate-bg)"></li>
        </ul>
        <ul class="swatches">
          <li style="background: var(--color-gold-text)"></li>
          <li style="background: var(--color-gold)"></li>
        </ul>
        <ul class="swatches">
          <li style="background: var(--color-accent)"></li>
        </ul>
      </div>
    </section>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
