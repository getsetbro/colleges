<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('college-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Your saved colleges, with full College Scorecard data." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>Your Saved Colleges</title>
  </head>
  <body>
    <main>
      <page-header heading="Your favorites." accent="favorites" current="favorites"></page-header>
      <college-results></college-results>
    </main>
    <footer>
      <span>Data from the U.S. Department of Education College Scorecard</span
      ><a href="https://collegescorecard.ed.gov/data/" target="_blank" rel="noreferrer">API documentation ↗</a>
    </footer>
    <theme-toggle></theme-toggle>
    <script type="module" src="/src/favorites.js"></script>
  </body>
</html>
